[project]
name = "sana-sprint-alpha-incontext"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "torchvision",
    "diffusers>=0.35",
    "transformers>=4.56",
    "accelerate",
    "peft",
    "safetensors",
    "huggingface_hub",
    "prodigyopt",
    "einx",
    "fire",
    "rp",
    "numpy",
    "pandas",
    "pillow",
    "pylance",
    "pyarrow",
    "sentencepiece",
    "protobuf",
    "gradio>=6.32.0",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "onnxruntime-gpu>=1.32.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
